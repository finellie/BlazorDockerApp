name: Build and publish image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./src/BlazorDockerApp
          file: ./src/BlazorDockerApp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Notify Dockhand to pull the new image and recreate the stack.
  # Runs only after a successful push to the default branch (not on PRs).
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dockhand deploy webhook
        env:
          DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOCKHAND_WEBHOOK_URL" ]; then
            echo "::warning::DOCKHAND_WEBHOOK_URL secret is not set — skipping auto-deploy."
            echo "Add it in: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi

          echo "Triggering Dockhand webhook..."
          http_code=$(curl -sS -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$DOCKHAND_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\",\"digest\":\"${{ needs.build-and-push.outputs.digest }}\",\"sha\":\"${{ github.sha }}\"}")

          echo "HTTP status: $http_code"
          echo "Response:"
          cat /tmp/response.txt || true

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Dockhand webhook returned HTTP $http_code"
            exit 1
          fi

          echo "::notice::Dockhand deploy triggered successfully (HTTP $http_code)"
